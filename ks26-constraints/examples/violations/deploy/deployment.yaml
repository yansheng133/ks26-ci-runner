apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks26-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks26-app
  template:
    metadata:
      labels:
        app: ks26-app
    spec:
      containers:
        - name: app
          image: docker.io/ks26demo/ks26-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: {name: ks26-app, key: PORT}
            - name: APP_OWNER
              valueFrom:
                configMapKeyRef: {name: ks26-app, key: APP_OWNER}
            - name: IMAGE_TAG
              value: "a1b2c3d"
          securityContext:
            privileged: true
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
