# 正式路徑（活動當天用的）。明寫出來,不要靠「沒有 drop-in 就會用預設」——
# 之前就是把驗證沙盒的路徑留在這裡,畫面顯示得很正常,只是資料是假的。
# systemctl cat ks26-board 就看得到這裡寫了什麼。
[Service]
Environment=KS26_CONF=/home/ec2-user/ks26/ks26-buildvm/groups.conf
Environment=KS26_STATE=/home/ec2-user/ks26/ks26-buildvm/state
Environment=KS26_LOG=/home/ec2-user/ks26/ks26-buildvm/watcher.log
