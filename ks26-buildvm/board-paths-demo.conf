# 驗證沙箱（現在用的）。當天改成正式路徑就把整個 drop-in 刪掉：
#   sudo rm -r /etc/systemd/system/ks26-board.service.d && sudo systemctl daemon-reload && sudo systemctl restart ks26-board
# 腳本預設就是 ks26-buildvm/ 底下的 groups.conf、state、watcher.log。
[Service]
Environment=KS26_CONF=/home/ec2-user/ks26/board-demo/groups.conf
Environment=KS26_STATE=/home/ec2-user/ks26/board-demo/state
Environment=KS26_LOG=/home/ec2-user/ks26/board-demo/watcher.log
